# Single-server starter (fits a CX23 2 vCPU / 4 GB box).
#
# Runs Postgres + app (combined admin + storefront) + Caddy on one host.
# Split into control/storefront later when you add a second server.
#
#   docker compose -f deploy/docker-compose.single.yml --env-file deploy/env/single.env up -d --build

name: mosmo-single

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    # Loopback only — never expose Postgres publicly on a single box.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Combined = admin + storefront on one process (single-box mode)
      DEPLOYMENT_ROLE: ${DEPLOYMENT_ROLE:-combined}
      RUN_DB_PUSH: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-https://${CONTROL_DOMAIN}}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      DOMAIN_PROVIDER: selfhost
      STOREFRONT_IP: ${STOREFRONT_IP}
      STOREFRONT_CNAME: ${STOREFRONT_CNAME:-}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Owner}
    expose:
      - "3000"
    volumes:
      # Persist admin product uploads across rebuilds
      - app-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1536M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CONTROL_DOMAIN: ${CONTROL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Allow dashboard from anywhere on first boot; tighten later.
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./caddy/Caddyfile.single:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    ports:
      - "80:80"
      - "443:443"

  # Permanent customer preview for the NORVEXA WoodMart showcase (static, no cart).
  # URL: http://<server-ip>:8080/
  norvexa-preview:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./previews/norvexa:/srv:ro
      - ./caddy/Caddyfile.norvexa-preview:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          memory: 64M

  seed:
    profiles: ["setup"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Owner}
      SEED_DEMO_DATA: "false"
    command: sh -c "npx prisma db push --skip-generate && npx tsx prisma/seed.ts"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  db-data:
  app-uploads:
  caddy-data:
  caddy-config:
  caddy-logs:
